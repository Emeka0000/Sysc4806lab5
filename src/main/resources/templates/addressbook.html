<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Address Book</title>
</head>
<body>
<h1>Address Book #<span th:text="${addressBook.id}">1</span></h1>

<table border="1" cellpadding="6">
    <thead>
    <tr>
        <th>Name</th>
        <th>Phone Number</th>
        <th>Address</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="buddy : ${addressBook.buddies}">
        <td th:text="${buddy.name}">Name</td>
        <td th:text="${buddy.phoneNumber}">Phone</td>
        <td th:text="${buddy.address}">Address</td>
    </tr>
    </tbody>
</table>
</body>
</html>
